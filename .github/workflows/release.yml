name: Release

# Push a semver tag (e.g. v1.0.0) on main → build all targets in parallel
# on native runners, then publish a GitHub Release with all artifacts.
#
# macOS builds are Developer ID signed + Apple notarized when the following
# secrets are present in the repo (same secrets used by siever-mail / get-it):
#
#   MAC_DEVELOPER_ID_CERT_BASE64     base64-encoded .p12 (cert + private key)
#   MAC_DEVELOPER_ID_CERT_PASSWORD   .p12 passphrase
#   APPLE_API_KEY_BASE64             base64-encoded App Store Connect .p8 key
#   APPLE_API_KEY_ID                 10-char key ID (e.g. NZR8LH3W32)
#   APPLE_API_ISSUER                 Issuer UUID
#
# When the cert secret is absent the macOS build falls back to ad-hoc signing.
# When only the cert is present (no ASC key) the build is signed but not notarized.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0). Inferred from tag on tag-push."
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast pre-flight (~1 min) so a type error or a syntax slip fails here instead of
  # 12 minutes into four parallel native builds.
  check:
    name: Typecheck & import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install -U pip
          pip install ./backend
      - name: Import every backend module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          bad = []
          for pkg in ("orchestrator", "humanbrowser", "automations"):
              m = importlib.import_module(pkg)
              for info in pkgutil.iter_modules(m.__path__, pkg + "."):
                  try:
                      importlib.import_module(info.name)
                  except Exception as e:
                      bad.append(f"{info.name}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all backend modules import cleanly")
          PY
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck

  build:
    name: ${{ matrix.target.label }}
    needs: check
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: mac-arm64
            label: macOS Apple Silicon
            os: macos-latest
            pyarch: arm64
          - id: mac-x64
            label: macOS Intel (cross-built on arm64 runner)
            os: macos-latest
            pyarch: x64
          - id: win-x64
            label: Windows x64
            os: windows-latest
            pyarch: x64
          - id: linux-x64
            label: Linux x64
            os: ubuntu-latest
            pyarch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME#v}"
          fi
          DOTS=$(echo "$RAW" | awk -F. '{print NF-1}')
          if [ "$DOTS" = "0" ]; then VER="${RAW}.0.0"
          elif [ "$DOTS" = "1" ]; then VER="${RAW}.0"
          else VER="$RAW"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.target.pyarch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── version injection ──────────────────────────────────────────────────
      - name: Inject version
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          cd frontend && npm version "$VER" --no-git-tag-version --allow-same-version
          cd ..
          python - "$VER" <<'PY'
          import re, sys, pathlib
          v = sys.argv[1]
          p = pathlib.Path("backend/pyproject.toml")
          p.write_text(re.sub(r'(?m)^version = ".*"$', f'version = "{v}"', p.read_text()))
          PY

      # ── backend freeze ─────────────────────────────────────────────────────
      - name: Install backend + PyInstaller
        shell: bash
        run: |
          python -m pip install -U pip
          pip install ./backend pyinstaller

      - name: Freeze backend (PyInstaller onedir)
        shell: bash
        working-directory: backend
        run: pyinstaller --noconfirm automation-backend.spec

      # The frozen binary is the one thing `npm run build` can't check: a missing
      # hidden import only shows up at runtime, inside the shipped app. Boot it and
      # hit /api/health so a broken freeze never reaches a release.
      # (skipped for mac-x64: that binary is cross-built and can't be trusted to
      # run on the arm64 runner)
      - name: Smoke-test the frozen backend
        if: matrix.target.id != 'mac-x64'
        shell: bash
        run: |
          BIN=backend/dist/automation-backend/automation-backend
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          AUTOMATION_DATA_DIR="$RUNNER_TEMP/smoke-data" "$BIN" api --port 8799 &
          PID=$!
          OK=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8799/api/health; then echo; OK=1; break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          if [ "$OK" = "1" ]; then echo "frozen backend OK"; else
            echo "frozen backend never became healthy"; exit 1
          fi

      # ── Chromium ───────────────────────────────────────────────────────────
      - name: Stage Chromium for this platform/arch
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/resources/chromium
        run: python -m patchright install chromium

      # ── frontend deps ──────────────────────────────────────────────────────
      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: npm ci

      # ── macOS code signing setup ───────────────────────────────────────────
      # Imports the Developer ID Application certificate into a one-shot keychain.
      # build.mjs detects it via `security find-identity` — same path as local builds.
      # Both steps short-circuit cleanly when their secret is absent.
      - name: Import Developer ID certificate (macOS only)
        if: startsWith(matrix.target.id, 'mac-')
        env:
          MAC_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MAC_DEVELOPER_ID_CERT_BASE64 }}
          MAC_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERT_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$MAC_DEVELOPER_ID_CERT_BASE64" ]; then
            echo "MAC_DEVELOPER_ID_CERT_BASE64 not set — falling back to ad-hoc"
            exit 0
          fi
          KP="$RUNNER_TEMP/build.keychain-db"
          KPW="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/devid.p12"
          echo -n "$MAC_DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KPW" "$KP"
          security set-keychain-settings -lut 21600 "$KP"
          security unlock-keychain -p "$KPW" "$KP"
          security import "$CERT" -P "$MAC_DEVELOPER_ID_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KP"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KP"
          security list-keychains -d user -s "$KP" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"
          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KP"

      - name: Stage App Store Connect notary key (macOS only)
        if: startsWith(matrix.target.id, 'mac-')
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        shell: bash
        run: |
          if [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo "APPLE_API_KEY_BASE64 not set — notarization skipped"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/apple"
          KEY="$RUNNER_TEMP/apple/AuthKey.p8"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          echo "APPLE_API_KEY=$KEY" >> "$GITHUB_ENV"

      # ── build & package ────────────────────────────────────────────────────
      - name: Build and package
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node build.mjs ${{ steps.ver.outputs.version }} --target=${{ matrix.target.id }}

      # ── upload ─────────────────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.id }}
          path: release/v${{ steps.ver.outputs.version }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    # Every target must have produced its artifacts: a release tagged v1.2.3 that
    # silently ships without the Windows installer is worse than no release.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/*
